spring.application.name=skillverse-backend
server.port=${PORT:8081}
server.servlet.context-path=/api

# MongoDB Atlas connection string, e.g.
# mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/skillverse?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://krishsareen06_db_user:VCjpbuP2F5Z5U3gL@skill-verse.kpeuz64.mongodb.net/skillverse}
spring.data.mongodb.database=${MONGODB_DATABASE:skillverse}

# JWT
skillverse.jwt.secret=${JWT_SECRET:9d723d653b119b64b6cb033b71779fec5d521b7d0e1ff2c9e6adca8c45299583}
skillverse.jwt.expiration-ms=86400000

# Allowed frontend origins (comma separated)
skillverse.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:8000,http://localhost:8080,http://localhost:5173,http://localhost:3000,https://*.lovable.app,https://*.lovableproject.com}

# Seed demo students on first start (only inserts when the collection is empty)
skillverse.seed.enabled=true

logging.level.org.springframework.data.mongodb=INFO

# Frontend URL used in password reset emails
skillverse.app.base-url=${APP_BASE_URL:http://localhost:8080}

# Profile photo uploads (stored in MongoDB GridFS)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SMTP (optional). Leave MAIL_HOST empty to print reset emails in the console instead.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
skillverse.mail.from=${MAIL_FROM:no-reply@skillverse.local}
